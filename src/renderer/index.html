<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; script-src 'self'; font-src 'self'" />
  <title>Browser Shell</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="titlebar" id="titlebar">
    <div class="tabstrip" id="tabstrip"></div>
    <button class="iconbtn newtab" id="newtab" title="New Tab (Cmd/Ctrl+T)" aria-label="New Tab">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none" />
      </svg>
    </button>
  </header>

  <div class="toolbar">
    <div class="navgroup">
      <button class="iconbtn" id="back" title="Back" aria-label="Back" disabled>
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </svg>
      </button>
      <button class="iconbtn" id="forward" title="Forward" aria-label="Forward" disabled>
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </svg>
      </button>
      <button class="iconbtn" id="reload" title="Reload" aria-label="Reload">
        <svg class="ico-reload" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M13 8a5 5 0 1 1-1.6-3.7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" />
          <path d="M13 2.5V5.2h-2.7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <svg class="ico-stop" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none" />
        </svg>
      </button>
    </div>

    <form class="omnibox" id="omnibox" autocomplete="off">
      <span class="omnibox-icon" id="omnibox-icon">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
          <path d="M4.5 7V5.5a3.5 3.5 0 1 1 7 0V7" stroke="currentColor" stroke-width="1.3" fill="none" />
          <rect x="3.2" y="7" width="9.6" height="6.4" rx="1.6" fill="currentColor" opacity="0.9" />
        </svg>
      </span>
      <input id="address" type="text" spellcheck="false" placeholder="Search or enter address" />
    </form>

    <div class="navgroup right">
      <button class="iconbtn" id="menu" title="Menu" aria-label="Menu">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <circle cx="8" cy="3.6" r="1.4" fill="currentColor" />
          <circle cx="8" cy="8" r="1.4" fill="currentColor" />
          <circle cx="8" cy="12.4" r="1.4" fill="currentColor" />
        </svg>
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
